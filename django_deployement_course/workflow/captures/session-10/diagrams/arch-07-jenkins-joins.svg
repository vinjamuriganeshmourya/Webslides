="0.96"/><text x="975" y="303.5" font-family='"Segoe UI", system-ui, sans-serif' font-size="16" fill="#2563EB" font-weight="normal" text-anchor="middle">SSH 22 over the VPC</text><text x="975" y="324.5" font-family='"Segoe UI", system-ui, sans-serif' font-size="16" fill="#2563EB" font-weight="normal" text-anchor="middle">to 172.31.7.32</text><text x="975" y="345.5" font-family='"Segoe UI", system-ui, sans-serif' font-size="16" fill="#2563EB" font-weight="normal" text-anchor="middle">allowed because the source</text><text x="975" y="366.5" font-family='"Segoe UI", system-ui, sans-serif' font-size="16" fill="#2563EB" font-weight="normal" text-anchor="middle">is the jenkins-sg group</text><polyline points="560,530 560,635 245,635" fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round" marker-end="url(#a-blue)"/><rect x="241.08" y="591" width="207.84" height="34" fill="#FFFFFF" opacity="0.96"/><text x="345" y="613" font-family='"Segoe UI", system-ui, sans-serif' font-size="16" fill="#2563EB" font-weight="normal" text-anchor="middle">docker push, HTTPS 443</text><text x="450" y="760" font-family='"Segoe UI", system-ui, sans-serif' font-size="18" fill="#64748B" font-weight="normal" text-anchor="start">ngrok is no longer needed. GitHub reaches Jenkins directly, on a public IP.</text></svg>