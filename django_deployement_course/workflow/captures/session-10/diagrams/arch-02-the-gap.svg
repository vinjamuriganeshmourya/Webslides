t-weight="bold" text-anchor="middle">GitHub</text><text x="505" y="370" font-family='"Segoe UI", system-ui, sans-serif' font-size="15" fill="#334155" font-weight="normal" text-anchor="middle">github.com/</text><text x="505" y="391" font-family='"Segoe UI", system-ui, sans-serif' font-size="15" fill="#334155" font-weight="normal" text-anchor="middle">jeevan170902/nxttrendz</text><rect x="740" y="300" width="220" height="170" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="850" y="342" font-family='"Segoe UI", system-ui, sans-serif' font-size="19" fill="#0F172A" font-weight="bold" text-anchor="middle">Docker Hub</text><text x="850" y="370" font-family='"Segoe UI", system-ui, sans-serif' font-size="16" fill="#334155" font-weight="normal" text-anchor="middle">jeevansravanth/</text><text x="850" y="391" font-family='"Segoe UI", system-ui, sans-serif' font-size="16" fill="#334155" font-weight="normal" text-anchor="middle">nxttrendz-backend</text><text x="850" y="412" font-family='"Segoe UI", system-ui, sans-serif' font-size="16" fill="#334155" font-weight="normal" text-anchor="middle">nxttrendz-frontend</text><polyline points="270,380 400,380" fill="none" stroke="#0F172A" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ink)"/><text x="335" y="352" font-family='"Segoe UI", system-ui, sans-serif' font-size="15" fill="#334155" font-weight="normal" text-anchor="middle">git push</text><text x="335" y="371" font-family='"Segoe UI", system-ui, sans-serif' font-size="15" fill="#334155" font-weight="normal" text-anchor="middle">HTTPS 443</text><polyline points="160,300 160,240 850,240 850,300" fill="none" stroke="#0F172A" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ink)"/><rect x="400.0" y="218" width="210" height="26" fill="#FFFFFF" opacity="0.96"/><text x="505" y="234" font-family='"Segoe UI", system-ui, sans-serif' font-size="16" fill="#334155" font-weight="normal" text-anchor="middle">image push, HTTPS 443</text><polyline points="