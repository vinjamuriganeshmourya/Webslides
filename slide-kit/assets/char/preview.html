<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character rig preview</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #f4f5f9; --panel: #ffffff; --line: #dfe3ec; --text: #1f2540; --muted: #69708a; --accent: #f99f2d; --accent-ink: #5a2f00; --blue: #2e6ba6; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13.5px/1.4 system-ui, sans-serif; color: var(--text); background: var(--bg); display: grid; grid-template-columns: minmax(0, 1fr) 400px; height: 100vh; }
  #stage { position: relative; display: grid; place-items: center; overflow: hidden; }
  #stage svg { height: 100vh; width: auto; max-width: 100%; touch-action: none; user-select: none; }
  #hud { position: absolute; left: 14px; top: 12px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #hud b { color: var(--text); }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 30px; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  p.hint { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; align-items: center; }
  .bar > span { color: var(--muted); font-size: 12px; margin-right: 2px; }
  button, select { font: inherit; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text); cursor: pointer; }
  button:hover { border-color: #9aa3ba; }
  button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  label.check { display: inline-flex; align-items: center; gap: 6px; margin-right: 10px; white-space: nowrap; }
  label.check:has(input:disabled) { color: #a5abbd; }
  input[type=checkbox] { accent-color: var(--accent); }
  details { border-top: 1px solid var(--line); }
  summary { cursor: pointer; padding: 9px 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  summary span { float: right; letter-spacing: 0; text-transform: none; font-weight: 400; }
  .row { display: grid; grid-template-columns: 148px 1fr 56px; align-items: center; gap: 8px; height: 25px; }
  .row label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  .row input[type=number] { width: 56px; font: inherit; font-variant-numeric: tabular-nums; padding: 1px 4px; border: 1px solid var(--line); border-radius: 4px; text-align: right; color: var(--text); background: #fff; }
  .row.ik label { color: var(--blue); }
  .ik-handle { fill: rgba(46, 107, 166, .16); stroke: var(--blue); stroke-width: 3; cursor: grab; }
  .ik-handle.limit { stroke: #d73d2e; fill: rgba(215, 61, 46, .18); }
  .ik-target { fill: none; stroke: #d73d2e; stroke-width: 2; stroke-dasharray: 5 5; pointer-events: none; }
  .pivot-dot { fill: #d73d2e; stroke: #fff; stroke-width: 1.5; pointer-events: none; }
  @media (max-width: 820px) { body { grid-template-columns: 1fr; grid-template-rows: 52vh 1fr; } #stage svg { height: 52vh; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<main id="stage"><div id="hud"></div></main>

<aside>
  <h1>Character rig preview</h1>
  <p class="hint">Every slider stops at the limit in <code>rig.json</code>. <b>R</b> is the character's right, on the left of the screen. Double-click a slider to return it to its default.</p>

  <div class="bar">
    <button id="reset">Reset pose</button>
    <button id="wave" aria-pressed="false">Wave</button>
    <button id="walk" aria-pressed="false">Walk in place</button>
  </div>
  <div class="bar">
    <label class="check"><input type="checkbox" id="physics" checked> Physics</label>
    <label class="check"><input type="checkbox" id="breathing" checked> Breathing</label>
    <label class="check"><input type="checkbox" id="ik"> IK handles</label>
    <label class="check"><input type="checkbox" id="pivots"> Joint pivots</label>
  </div>
  <div class="bar">
    <span>Hands</span>
    <button data-hand="fist">Fist</button><button data-hand="open">Open</button><button data-hand="relaxed">Relaxed</button>
    <select id="hand-side" aria-label="Which hand"><option value="rl">Both</option><option value="r">Right</option><option value="l">Left</option></select>
  </div>
  <div id="groups"></div>
</aside>

<script src="char.bundle.js"></script>
<script src="rig.js"></script>
<script>
(async function () {
  /* ----- load: the two files when served, the bundled copy when opened from disk ----- */
  let svgText, data, source = 'character.svg + rig.json';
  try {
    const [a, b] = await Promise.all([fetch('character.svg'), fetch('rig.json')]);
    if (!a.ok || !b.ok) throw new Error('not served');
    svgText = await a.text(); data = await b.json();
  } catch (e) { svgText = window.CHAR_BUNDLE.svg; data = window.CHAR_BUNDLE.rig; source = 'char.bundle.js (opened from disk)'; }

  const stage = document.getElementById('stage');
  const svg = document.importNode(new DOMParser().parseFromString(svgText, 'image/svg+xml').documentElement, true);
  svg.setAttribute('viewBox', '-150 -130 1386 1620');     // room for raised arms
  stage.prepend(svg);
  const rig = new CharRig.Rig(svg, data);
  window.rig = rig;

  const NS = svg.namespaceURI, $ = id => document.getElementById(id);
  const ui = document.createElementNS(NS, 'g'); ui.id = 'ui-layer'; svg.append(ui);

  /* ----- sliders, one per joint, grouped ----- */
  const rows = new Map();
  const groups = ['Head', 'Torso', 'Arms', 'Hands and fingers', 'Legs'];
  const chainOf = {};
  for (const [name, c] of Object.entries(data.ik)) for (const j of Object.values(c.joints)) chainOf[j] = name;
  for (const gname of groups) {
    const js = data.joints.filter(j => j.group === gname);
    const det = document.createElement('details');
    det.open = gname === 'Arms' || gname === 'Legs';
    det.innerHTML = `<summary>${gname}<span>${js.length} joints</span></summary>`;
    for (const j of js) {
      const row = document.createElement('div'); row.className = 'row';
      const step = j.unit === 'px' ? 0.5 : 1;
      row.innerHTML = `<label title="${j.id}: ${j.min} to ${j.max} ${j.unit}">${j.label}</label><input type="range" min="${j.min}" max="${j.max}" step="${step}" aria-label="${j.label}"><input type="number" min="${j.min}" max="${j.max}" step="${step}" aria-label="${j.label} value">`;
      const [, range, num] = row.children;
      const write = v => {
        if (chainOf[j.id] && rig.ik[chainOf[j.id]].active) rig.setIK(chainOf[j.id], false);   // a slider takes the limb back from IK
        show(j.id, rig.set(j.id, v));
      };
      range.addEventListener('input', () => write(range.value));
      num.addEventListener('change', () => write(num.value));
      range.addEventListener('dblclick', () => write(j.default));
      rows.set(j.id, { row, range, num, shown: null });
      det.append(row);
    }
    $('groups').append(det);
  }
  function show(id, v) {
    const r = rows.get(id); v = Math.round(v * 10) / 10;
    if (r.shown === v) return;
    r.shown = v; r.range.value = v; if (document.activeElement !== r.num) r.num.value = v;
  }
  const syncSliders = () => { for (const [id, j] of rig.joints) show(id, j.value); };

  /* ----- buttons and switches ----- */
  const anim = name => {
    const on = rig.anim.name === name;
    on ? rig.stop() : rig.play(name);
    for (const n of ['wave', 'walk']) $(n).setAttribute('aria-pressed', String(!on && n === name));
  };
  $('wave').onclick = () => anim('wave');
  $('walk').onclick = () => anim('walk');
  $('reset').onclick = () => { rig.reset(); for (const n of ['wave', 'walk']) $(n).setAttribute('aria-pressed', 'false'); syncSliders(); };
  $('physics').onchange = e => { rig.physics = e.target.checked; $('breathing').disabled = !rig.physics; rig.settle(); };
  $('breathing').onchange = e => { rig.breathing = e.target.checked; };
  for (const b of document.querySelectorAll('[data-hand]')) b.onclick = () => { rig.hand(b.dataset.hand, $('hand-side').value.split('')); syncSliders(); };

  /* ----- IK handles: drag a hand or a foot; the handle stays on what the limb can reach ----- */
  const handles = {};
  const toCanvas = ev => { const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(svg.getScreenCTM().inverse()); return [p.x, p.y]; };
  for (const name of Object.keys(data.ik)) {
    const ring = document.createElementNS(NS, 'circle'); ring.setAttribute('class', 'ik-target'); ring.setAttribute('r', 9);
    const h = document.createElementNS(NS, 'circle'); h.setAttribute('class', 'ik-handle'); h.setAttribute('r', 20); h.dataset.ik = name;
    const t = document.createElementNS(NS, 'title'); t.textContent = data.ik[name].label + ' (drag)'; h.append(t);
    h.addEventListener('pointerdown', ev => { h.setPointerCapture(ev.pointerId); rig.setIK(name, true); h.dragging = true; ev.preventDefault(); });
    h.addEventListener('pointermove', ev => { if (h.dragging) h.want = toCanvas(ev); });
    const end = () => { h.dragging = false; };
    h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
    ui.append(ring, h); handles[name] = { h, ring };
  }
  const pivotLayer = document.createElementNS(NS, 'g'); ui.append(pivotLayer);
  const dots = data.bones.map(b => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('class', 'pivot-dot'); c.setAttribute('r', 4); const t = document.createElementNS(NS, 'title'); t.textContent = b.id; c.append(t); pivotLayer.append(c); return [b.id, c]; });

  /* ----- frame loop ----- */
  let frames = 0, acc = 0, worst = 0, fps = 0;
  rig.onframe = () => {
    const ikOn = $('ik').checked;
    for (const [name, { h }] of Object.entries(handles)) if (h.dragging && h.want) rig.moveIK(name, ...h.want);   // keep asking while held
    for (const [name, { h, ring }] of Object.entries(handles)) {
      const c = rig.ik[name];
      h.style.display = ring.style.display = ikOn ? '' : 'none';
      if (!ikOn) continue;
      h.setAttribute('cx', c.effector[0]); h.setAttribute('cy', c.effector[1]);
      // red while the pointer asks for more than the limits allow; the dashed ring marks where the pointer is
      const off = c.active && h.dragging && !c.reached;
      h.classList.toggle('limit', off);
      ring.style.display = off ? '' : 'none'; if (h.want) { ring.setAttribute('cx', h.want[0]); ring.setAttribute('cy', h.want[1]); }
    }
    pivotLayer.style.display = $('pivots').checked ? '' : 'none';
    if ($('pivots').checked) for (const [id, c] of dots) { const p = rig.pivot(id); c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); }
    if (rig.frame % 4 === 0) syncSliders();
  };
  let last = performance.now();
  (function tick(now) {
    const dt = (now - last) / 1000; last = now;
    rig.step(dt); rig.onframe();
    frames++; acc += dt; worst = Math.max(worst, dt);
    if (acc >= 0.5) { fps = frames / acc; $('hud').innerHTML = `<b>${fps.toFixed(0)}</b> fps &nbsp; slowest frame ${(worst * 1000).toFixed(0)} ms &nbsp; loaded from ${source}`; window.__fps = fps; frames = 0; acc = 0; worst = 0; }
    requestAnimationFrame(tick);
  })(last);
  syncSliders();
  window.__ready = true;
})();
</script>
</body>
</html>
