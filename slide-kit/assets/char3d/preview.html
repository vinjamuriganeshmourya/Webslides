<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D character rig preview</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #f6f6fa; --panel: #ffffff; --line: #dfe3ec; --text: #1f2540; --muted: #69708a; --accent: #f99f2d; --accent-ink: #5a2f00; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 13.5px/1.4 system-ui, sans-serif; color: var(--text); background: var(--bg); display: grid; grid-template-columns: minmax(0, 1fr) 410px; height: 100vh; overflow: hidden; }
  #stage { position: relative; overflow: hidden; min-height: 0; }
  #stage canvas { display: block; touch-action: none; }
  #hud { position: absolute; left: 14px; top: 12px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none; }
  #hud b { color: var(--text); }
  #views { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
  #tip { position: absolute; right: 14px; bottom: 16px; color: var(--muted); font-size: 12px; pointer-events: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 30px; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  p.hint { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; align-items: center; }
  .bar > span { color: var(--muted); font-size: 12px; margin-right: 2px; }
  button, select { font: inherit; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text); cursor: pointer; }
  button:hover { border-color: #9aa3ba; }
  button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  label.check { display: inline-flex; align-items: center; gap: 6px; margin-right: 10px; white-space: nowrap; }
  label.check:has(input:disabled) { color: #a5abbd; }
  input[type=checkbox] { accent-color: var(--accent); }
  details { border-top: 1px solid var(--line); }
  summary { cursor: pointer; padding: 9px 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  summary span { float: right; letter-spacing: 0; text-transform: none; font-weight: 400; }
  .row { display: grid; grid-template-columns: 172px 1fr 56px; align-items: center; gap: 8px; height: 25px; }
  .row label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  .row input[type=number] { width: 56px; font: inherit; font-variant-numeric: tabular-nums; padding: 1px 4px; border: 1px solid var(--line); border-radius: 4px; text-align: right; color: var(--text); background: #fff; }
  @media (max-width: 820px) { body { grid-template-columns: 1fr; grid-template-rows: 54vh 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<main id="stage">
  <div id="loading">Building the character…</div>
  <div id="hud"></div>
  <div id="views">
    <button data-view="front">Front</button><button data-view="three">Three-quarter</button><button data-view="side">Side</button><button data-view="back">Back</button><button data-view="face">Face</button><button data-view="hand">Hand</button>
  </div>
  <div id="tip">Drag to orbit · scroll to zoom · right-drag to pan</div>
</main>

<aside>
  <h1>3D character rig preview</h1>
  <p class="hint">A real 3D model: turn it with the mouse. Every slider stops at the limit in <code>rig.json</code>. <b>R</b> is the character's right. Double-click a slider to return it to its default.</p>
  <div class="bar">
    <span>Character</span>
    <select id="cast" aria-label="Character"></select>
  </div>
  <div class="bar">
    <button id="reset">Reset pose</button>
    <button id="wave" aria-pressed="false">Wave</button>
    <button id="walk" aria-pressed="false">Walk in place</button>
    <button id="parkour" aria-pressed="false" title="Plays once: a precision jump, then back to the spot">Parkour</button>
    <button id="rap" aria-pressed="false" title="Plays once: eight beats of a hip-hop bounce">Rap Dance</button>
  </div>
  <div class="bar">
    <label class="check"><input type="checkbox" id="physics" checked> Physics</label>
    <label class="check"><input type="checkbox" id="breathing" checked> Breathing</label>
    <label class="check"><input type="checkbox" id="ik"> IK handles</label>
    <label class="check"><input type="checkbox" id="pivots"> Joint pivots</label>
  </div>
  <div class="bar">
    <span>Hands</span>
    <button data-hand="fist">Fist</button><button data-hand="open">Open</button><button data-hand="relaxed">Relaxed</button>
    <select id="hand-side" aria-label="Which hand"><option value="rl">Both</option><option value="r">Right</option><option value="l">Left</option></select>
  </div>
  <div id="groups"></div>
</aside>
<script src="char3d.bundle.js"></script>
</body>
</html>
