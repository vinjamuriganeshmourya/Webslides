  <g fill="#FFFFFF" transform="translate(300,12)">
    <rect x="0" y="4" width="3" height="6" rx="1"/>
    <rect x="5" y="2" width="3" height="8" rx="1"/>
    <rect x="10" y="0" width="3" height="10" rx="1"/>
    <path d="M24 10 q4 -6 9 0 l-4.5 4.5 z"/>
    <rect x="44" y="1" width="20" height="10" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <rect x="46" y="3" width="13" height="6" rx="1.4"/>
  </g>

  <!-- the brand, said once -->
  <g transform="translate(32,54)"><circle cx="0" cy="0" r="11" fill="#1DB954"/><g fill="none" stroke="#121212" stroke-linecap="round"><path d="M-6.6,-2.9 C-2.7,-5.0 3.4,-4.4 6.6,-2.2" stroke-width="2.1"/><path d="M-5.3,0.7 C-2.0,-1.1 2.9,-0.7 5.5,1.0" stroke-width="1.9"/><path d="M-4.1,3.9 C-1.6,2.6 2.0,2.9 4.2,4.2" stroke-width="1.6"/></g></g>
  <text x="50" y="59" style="font:700 16px var(--sans)" fill="#FFFFFF">Spotify</text>

  <!-- the playlist header -->
