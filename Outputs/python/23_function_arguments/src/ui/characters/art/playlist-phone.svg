    <rect x="0" y="626" width="380" height="74" fill="#181818"/>
    <rect x="0" y="626" width="380" height="3" fill="#2A2A2A"/>
    <rect x="0" y="626" width="248" height="3" fill="#1DB954"/>
    <g><rect x="16" y="640" width="44" height="44" rx="4" fill="#5B62B0"/><path d="M16 684 L60 640 v44 z" fill="#000000" opacity=".18"/><g transform="translate(28.32,649.68) scale(1.2222222222222223)" fill="#FFFFFF" opacity="0.92"><path d="M7.2 15 V3.4 h1.7 V15 z"/><path d="M18.2 13 V1.2 h1.7 V13 z"/><path d="M7.2 2.2 L19.9 0 V3.9 L7.2 6.1 z"/><ellipse cx="4.4" cy="15.2" rx="3.9" ry="2.9" transform="rotate(-20 4.4 15.2)"/><ellipse cx="15.4" cy="13.2" rx="3.9" ry="2.9" transform="rotate(-20 15.4 13.2)"/></g></g>
    <text x="70" y="660" style="font:600 14px var(--sans)" fill="#FFFFFF">Playing</text>
    <text x="70" y="680" style="font:12px var(--sans)" fill="#A7A7A7">Today's Mix</text>
    <path d="M338 652 l14 9 -14 9 z" fill="#FFFFFF"/>
  </g>
  <g class="hk-stop">
    <rect x="0" y="626" width="380" height="74" fill="#181818"/>
    <rect x="0" y="626" width="380" height="3" fill="#2A2A2A"/>
    <g><rect x="16" y="640" width="44" height="44" rx="4" fill="#4A4A4A"/><path d="M16 684 L60 640 v44 z" fill="#000000" opacity=".18"/><g transform="translate(28.32,649.68) scale(1.2222222222222223)" fill="#FFFFFF" opacity="0.92"><path d="M7.2 15 V3.4 h1.7 V15 z"/><path d="M18.2 13 V1.2 h1.7 V13 z"/><path d="M7.2 2.2 L19.9 0 V3.9 L7.2 6.1 z"/><ellipse cx="4.4" cy="15.2" rx="3.9" ry="2.9" transform="rotate(-20 4.4 15.2)"/><ellipse cx="15.4" cy="13.2" rx="3.9" ry="2.9" transform="rotate(-20 15.4 13.2)"/></g></g>
    <text x="70" y="660" style="font:600 14px var(--sans)" fill="#FFFFFF">Stopped</text>
    <text x="70" y="680" style="font:12px var(--sans)" fill="#A7A7A7">The list ended</text>
    <rect x="338" y="652" width="5" height="18" rx="2" fill="#FFFFFF"/>
    <rect x="347" y="652" width="5" height="18" rx="2" fill="#FFFFFF"/>
