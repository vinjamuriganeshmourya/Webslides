sform="rotate(-20 4.4 15.2)"/><ellipse cx="15.4" cy="13.2" rx="3.9" ry="2.9" transform="rotate(-20 15.4 13.2)"/></g></g><text x="82" y="362" style="font:600 18px var(--sans)" fill="#FFFFFF" class="hk-t2">Old Road</text><text x="82" y="384" style="font:14px var(--sans)" fill="#A7A7A7">Kabir Sen</text><text x="300" y="375" text-anchor="end" style="font:13px var(--mono)" fill="#6F6F6F">3:21</text></g><g><g><rect x="20" y="411" width="48" height="48" rx="4" fill="#3C8A72"/><path d="M20 459 L68 411 v48 z" fill="#000000" opacity=".18"/><g transform="translate(33.44,421.56) scale(1.3333333333333333)" fill="#FFFFFF" opacity="0.92"><path d="M7.2 15 V3.4 h1.7 V15 z"/><path d="M18.2 13 V1.2 h1.7 V13 z"/><path d="M7.2 2.2 L19.9 0 V3.9 L7.2 6.1 z"/><ellipse cx="4.4" cy="15.2" rx="3.9" ry="2.9" transform="rotate(-20 4.4 15.2)"/><ellipse cx="15.4" cy="13.2" rx="3.9" ry="2.9" transform="rotate(-20 15.4 13.2)"/></g></g><text x="82" y="432" style="font:600 18px var(--sans)" fill="#FFFFFF" class="hk-t3">Paper Boats</text><text x="82" y="454" style="font:14px var(--sans)" fill="#A7A7A7">Meera</text><text x="300" y="445" text-anchor="end" style="font:13px var(--mono)" fill="#6F6F6F">5:04</text></g><g><g><rect x="20" y="481" width="48" height="48" rx="4" fill="#A34A55"/><path d="M20 529 L68 481 v48 z" fill="#000000" opacity=".18"/><g transform="translate(33.44,491.56) scale(1.3333333333333333)" fill="#FFFFFF" opacity="0.92"><path d="M7.2 15 V3.4 h1.7 V15 z"/><path d="M18.2 13 V1.2 h1.7 V13 z"/><path d="M7.2 2.2 L19.9 0 V3.9 L7.2 6.1 z"/><ellipse cx="4.4" cy="15.2" rx="3.9" ry="2.9" transform="rotate(-20 4.4 15.2)"/><ellipse cx="15.4" cy="13.2" rx="3.9" ry="2.9" transform="rotate(-20 15.4 13.2)"/></g></g><text x="82" y="502" style="font:600 18px var(--sans)" fill="#FFFFFF" class="hk-t4">Last Bus Home</text><text x="82" y="524" style="font:14px var(--sans)" fill="#A7A7A7">Nikhil D</text><text x="300" y="515" text-anchor="end" style="font:13px var(--mono)" fill="#6F6F6F">3:47</text></g><g class="hk-new"><g><rect x="20" y="551" width="48" height="48" rx="4" fill="#5B62B0"/><path d="M20 599 L68 551 v48 z" fill="#000000" opacity=".18"/><g transform="translate(33.44,561.56) scale(1.3333333333333333)" fill="#FFFFFF" opacity="0.92"><path d="M7.2 15 V3.4 h1.7 V15 z"/><path d="M18.2 13 V1.2 h1.7 V13 z"/><path d="M7.2 2.2 L19.9 0 V3.9 L7.2 6.1 z"/><ellipse cx="4.4" cy="15.2" rx="3.9" ry="2.9" transform="rotate(-20 4.4 15.2)"/><ellipse cx="15.4" cy="13.2" rx="3.9" ry="2.9" transform="rotate(-20 15.4 13.2)"/></g></g><text x="82" y="572" style="font:600 18px var(--sans)" fill="#FFFFFF" class="hk-t5">One More Song</text><text x="82" y="594" style="font:14px var(--sans)" fill="#A7A7A7">Ananya Rao</text><text x="300" y="585" text-anchor="end" style="font:13px var(--mono)" fill="#6F6F6F">4:30</text></g>
