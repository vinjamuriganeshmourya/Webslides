    <g transform="translate(46,100) scale(1.9)" fill="#0B3B1E" opacity="0.85"><path d="M7.2 15 V3.4 h1.7 V15 z"/><path d="M18.2 13 V1.2 h1.7 V13 z"/><path d="M7.2 2.2 L19.9 0 V3.9 L7.2 6.1 z"/><ellipse cx="4.4" cy="15.2" rx="3.9" ry="2.9" transform="rotate(-20 4.4 15.2)"/><ellipse cx="15.4" cy="13.2" rx="3.9" ry="2.9" transform="rotate(-20 15.4 13.2)"/></g>
