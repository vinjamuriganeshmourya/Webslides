<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo-nxtwave.png" />
    <!-- `viewport-fit=cover`: the page runs under the notch and the home indicator
         and the control bar keeps clear of them with the safe-area insets, which
         are zero without it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Filled from deck.config.json by the `deck-title` plugin in vite.config.ts.
         This file is kit, so it must not name a session. -->
    <title>%DECK_TITLE%</title>
    <!-- Poppins (headings) + Inter (kicker and body) + JetBrains Mono (code).
         Poppins replaced Sora on 2026-09-25, see STYLE_GUIDE.md "Typefaces". -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
