<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instructor Guide - {{TITLE}}</title>
<style>
:root{
  --ink:#181B21; --mid:#3A3F4B; --muted:#63697A; --page:#FFFFFF;
  --rule:#D9DDE5; --rule2:#EEF0F4; --soft:#F6F7F9;
  --accent:#4F46E5; --hook:#0B7285;
  --activity:#B4531A; --activity-soft:#FDF2E6; --quiz:#7C3AED;
  --exit:#0F766E;
  --sidebar:272px;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#EDEFF3;color:var(--ink);font:16px/1.62 var(--sans);
  -webkit-font-smoothing:antialiased}

/* ---------------- sidebar ---------------- */
.side{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar);background:var(--page);
  border-right:1px solid var(--rule);padding:22px 16px 30px;overflow-y:auto;z-index:20}
.side-h{font-size:15px;font-weight:740;letter-spacing:-.01em;margin:0 0 2px}
.side-sub{font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.5}
.nav-item{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;
  text-decoration:none;color:var(--ink);background:none;border:0;
  border-left:3px solid var(--rule);border-radius:0 7px 7px 0;
  padding:7px 10px;margin:0 0 3px;font:600 13px/1.35 var(--sans);cursor:pointer;
  transition:background-color 140ms ease}
.nav-item:hover{background:var(--rule2)}
.nav-item.current{background:var(--rule2)}
.nav-n{flex:0 0 auto;color:var(--muted);font-weight:700;font-size:11.5px;padding-top:1px}
.nav-l{flex:1 1 auto}
.nav-t{flex:0 0 auto;color:var(--muted);font-weight:600;font-size:11px;white-space:nowrap}
.nav-item.k-hook{border-left-color:var(--hook)}
.nav-item.k-activity{border-left-color:var(--activity)}
.nav-item.k-hands{border-left-color:var(--exit)}
.nav-item.k-quiz{border-left-color:var(--quiz)}
.nav-item.current.k-concept{border-left-color:var(--accent)}
.cp{display:flex;align-items:center;margin:14px 0 9px}
.cp span{flex:0 0 auto;background:var(--ink);color:#fff;border-radius:5px;
  font:700 10.5px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;padding:5px 8px}
.cp::after{content:'';flex:1;height:1px;margin-left:8px;background:var(--rule)}
.cp.floor span{background:var(--activity)}

/* ---------------- sheet ---------------- */
.sheet{max-width:820px;margin:28px auto;margin-left:calc(var(--sidebar) + 40px);
  background:var(--page);padding:52px 60px 68px;
  box-shadow:0 1px 2px rgba(20,20,40,.05),0 10px 30px rgba(20,20,40,.08)}
h1{font-size:30px;line-height:1.2;font-weight:760;letter-spacing:-.02em;margin:0 0 4px}
.kicker{font:700 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px}
.meta{font-size:14.5px;color:var(--mid);margin:0 0 6px}
.meta b{color:var(--ink);font-weight:680}
h2{font-size:21px;font-weight:730;letter-spacing:-.015em;margin:0 0 4px;scroll-margin-top:20px}
h2 .num{color:var(--muted);font-weight:700;margin-right:8px}
h2 .clock{font-weight:600;color:var(--muted);font-size:15px;letter-spacing:0}
h3{font-size:16.5px;font-weight:700;margin:22px 0 6px}
section{border-top:1px solid var(--rule);margin-top:32px;padding-top:24px;scroll-margin-top:16px}
section.tight{margin-top:24px;padding-top:20px}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:22px}
li{margin:0 0 7px}
code{font:14px var(--mono);background:var(--rule2);border-radius:4px;padding:1px 5px}
pre{font:13.5px/1.6 var(--mono);background:var(--soft);border:1px solid var(--rule);
  border-radius:10px;padding:14px 16px;overflow-x:auto;margin:0 0 14px}
.say{border-left:4px solid var(--accent);background:#F7F7FE;border-radius:0 10px 10px 0;
  padding:12px 16px;margin:0 0 14px;font-style:italic;color:var(--mid)}
.say b{font-style:normal;color:var(--ink)}
.box{border:1px solid var(--rule);border-radius:12px;padding:18px 20px;margin:0 0 16px;background:var(--soft)}
.box h3{margin-top:0}
.safe{border-left:4px solid var(--exit);background:#EFF7F5;border-radius:0 10px 10px 0;
  padding:12px 16px;margin:0 0 14px}
.safe b{color:var(--exit)}
.act{border-left:4px solid var(--activity);background:var(--activity-soft);border-radius:0 10px 10px 0;
  padding:12px 16px;margin:0 0 14px}
.act b{color:var(--activity)}
.hookline{color:var(--hook);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;margin:0 0 6px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);border:1px solid var(--rule);
  border-radius:99px;padding:2px 10px;margin:0 0 10px}
table{border-collapse:collapse;width:100%;margin:0 0 14px;font-size:15px}
th,td{border:1px solid var(--rule);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:680}
.small{font-size:14.5px;color:var(--mid)}
.cpnote{display:flex;align-items:center;gap:10px;margin:22px 0 0;
  font:700 11.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cpnote span{background:var(--ink);color:#fff;border-radius:5px;padding:5px 9px;letter-spacing:.04em}
.cpnote.floor span{background:var(--activity)}

@media print{
  body{background:#fff;font-size:13px;line-height:1.48}
  .side{display:none}
  .sheet{box-shadow:none;margin:0;max-width:none;padding:0 0 10px}
  h1{font-size:24px}
  h2{font-size:18px;break-after:avoid}
  h2 .clock{font-size:13.5px}
  h3{font-size:14.5px;margin:14px 0 5px}
  .meta,.small{font-size:12.5px}
  section{margin-top:16px;padding-top:12px}
  section.tight{margin-top:15px;padding-top:12px}
  p{margin-bottom:7px}
  li{margin-bottom:4px}
  .box{padding:11px 13px;margin-bottom:10px}
  .say,.safe,.act{padding:8px 12px;margin-bottom:10px}
  pre{font-size:12px;padding:10px 12px;margin-bottom:10px}
  table{font-size:13px;margin-bottom:10px}
  th,td{padding:5px 8px}
  .cpnote{margin-top:16px;font-size:10.5px}
  .box,.say,.safe,.act,pre,table{break-inside:avoid}
  @page{margin:14mm 13mm}
}
@media (max-width:1180px){
  .side{position:static;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
  .sheet{margin:20px auto;padding:30px 22px 44px}
}
</style>
</head>
<body>

<nav class="side">
<p class="side-h">Instructor guide</p>
<p class="side-sub">{{SUBTITLE}}</p>
{{NAV}}
</nav>

<div class="sheet">

<h1>Instructor Guide - {{TITLE}}</h1>
<p class="meta"><b>Duration</b> {{DURATION}}</p>

{{SECTIONS}}

</div>

<script>
(function(){
  var links = Array.prototype.slice.call(document.querySelectorAll('.nav-item'));
  var map = {};
  links.forEach(function(a){ map[a.getAttribute('href').slice(1)] = a; });
  var seen = [];
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      var id = e.target.id;
      if (e.isIntersecting) { if (seen.indexOf(id) < 0) seen.push(id); }
      else { var i = seen.indexOf(id); if (i >= 0) seen.splice(i,1); }
    });
    if (!seen.length) return;
    var order = links.map(function(a){ return a.getAttribute('href').slice(1); });
    seen.sort(function(a,b){ return order.indexOf(a) - order.indexOf(b); });
    links.forEach(function(a){ a.classList.remove('current'); });
    var cur = map[seen[0]];
    if (cur) cur.classList.add('current');
  }, { rootMargin: '-10% 0px -70% 0px', threshold: 0 });
  document.querySelectorAll('section[id]').forEach(function(s){ io.observe(s); });
})();
</script>

</body>
</html>
