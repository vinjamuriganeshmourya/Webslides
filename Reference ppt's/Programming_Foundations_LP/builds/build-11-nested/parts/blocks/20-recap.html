<section class="block " id="recap"><div class="block-head"><span class="block-icon" aria-hidden="true">&#128216;</span><h2>Key Takeaways &mdash; the session as one map</h2></div><div class="pcard" data-label="Key Takeaways"><div class="slide-head"><span class="slide-title">Key Takeaways</span></div><div class="stage an-1" id="stage-recap" data-anim="7" data-anim-labels="conditional statements|nested if|the inner check|if - elif - else|the next check|indentation|never reached"><div class="sl-head"><span class="sl-bar" aria-hidden="true"></span><div><p class="sl-eyebrow">Nested Conditions &middot; Elif</p><h3 class="sl-title">Key Takeaways</h3></div></div>

<svg class="fig tkmap" viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg" role="img"
 aria-label="A map of the session: conditional statements branch into nested if and if-elif-else; both rest on indentation and on a check that is never reached never being asked">

<g>
<rect x="340" y="6" width="320" height="54" rx="13" fill="var(--dk-blue)"/>
<text x="500" y="42" text-anchor="middle" style="font:700 25px var(--sans)" fill="#fff">Conditional Statements</text>
</g>

<g>
<path d="M500 60 V92 H250 V118" fill="none" stroke="#C9D8E2" stroke-width="3"/>
<rect x="20" y="118" width="460" height="72" rx="12" fill="#fff" stroke="#00A3D9" stroke-width="3"/>
<text x="250" y="150" text-anchor="middle" style="font:700 25px var(--mono)" fill="#0B7FAD">Nested if</text>
<text x="250" y="177" text-anchor="middle" style="font:400 20px var(--sans)" fill="var(--dk-text)">an if written inside another if</text>
</g>

<g>
<path d="M250 190 V218" fill="none" stroke="#C9D8E2" stroke-width="3"/>
<rect x="20" y="218" width="460" height="86" rx="12" fill="#F2F8FB"/>
<text x="250" y="253" text-anchor="middle" style="font:400 21px var(--sans)" fill="var(--dk-text)">The inner check is asked</text>
<text x="250" y="283" text-anchor="middle" style="font:700 21px var(--sans)" fill="var(--dk-text)">only when the outer one is True</text>
</g>

<g>
<path d="M500 60 V92 H750 V118" fill="none" stroke="#C9D8E2" stroke-width="3"/>
<rect x="520" y="118" width="460" height="72" rx="12" fill="#fff" stroke="#0B5FA5" stroke-width="3"/>
<text x="750" y="150" text-anchor="middle" style="font:700 25px var(--mono)" fill="#0B5FA5">if - elif - else</text>
<text x="750" y="177" text-anchor="middle" style="font:400 20px var(--sans)" fill="var(--dk-text)">checks written one after another</text>
</g>

<g>
<path d="M750 190 V218" fill="none" stroke="#C9D8E2" stroke-width="3"/>
<rect x="520" y="218" width="460" height="86" rx="12" fill="#F2F8FB"/>
<text x="750" y="253" text-anchor="middle" style="font:400 21px var(--sans)" fill="var(--dk-text)">A check is asked only when</text>
<text x="750" y="283" text-anchor="middle" style="font:700 21px var(--sans)" fill="var(--dk-text)">every check above it was False</text>
</g>

<g>
<path d="M250 304 V322 H500 V336" fill="none" stroke="#C9D8E2" stroke-width="3"/>
<path d="M750 304 V322 H500 V336" fill="none" stroke="#C9D8E2" stroke-width="3"/>
<rect x="40" y="336" width="920" height="50" rx="12" fill="#fff" stroke="#C9D8E2" stroke-width="3"/>
<text x="500" y="368" text-anchor="middle" style="font:600 22px var(--sans)" fill="var(--dk-text)">Indentation says which block each line belongs to</text>
</g>

<g>
<rect x="40" y="394" width="920" height="52" rx="12" fill="#FDEFEC" stroke="var(--dk-red)" stroke-width="3"/>
<text x="500" y="428" text-anchor="middle" style="font:700 23px var(--sans)" fill="var(--dk-red)">A check that is never reached is never asked</text>
</g>

</svg>
