    <link rel="icon" type="image/png" href="/assets/logo-nxtwave.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Filled from deck.config.json by the `deck-title` plugin in vite.config.ts. -->
    <title>%DECK_TITLE%</title>
    <!-- The style guide's two typefaces: Sora SemiBold (section titles) and

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@600&display=swap"
      rel="stylesheet"
    />
